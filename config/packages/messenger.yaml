framework:
    messenger:
        failure_transport: failed

        transports:
            sync: 'sync://'
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: false
                    check_delayed_interval: 200
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
                    delay: 250
            fcm_async:
                dsn: '%env(MESSENGER_FCM_TRANSPORT_DSN)%'
                options:
                    use_notify: false
                    check_delayed_interval: 200
                retry_strategy:
                    max_retries: 5
                    multiplier: 2
                    delay: 150
            failed: 'doctrine://default?queue_name=failed'


        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            #Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
            Symfony\Component\Notifier\Message\ChatMessage: sync
            Symfony\Component\Notifier\Message\SmsMessage: sync
            App\Message\SendFcmNotificationMessage: fcm_async
            App\Message\WarmCredentialCacheMessage: fcm_async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
