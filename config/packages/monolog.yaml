monolog:
    channels: ['mailer']
    handlers:
        mailer:
            type: stream
            path: '%kernel.logs_dir%/mailer.log'
            level: debug
            channels: ['mailer']
when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/critical.log"
                level: error
                max_level: critical
                bubble: false
                # channels sort eltávolítva, csak szint alapján szűr
            info:
                type: stream
                path: "%kernel.logs_dir%/info.log"
                level: info
                max_level: info
                bubble: false
                # channels sort eltávolítva, csak szint alapján szűr
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                formatter: monolog.formatter.line
                bubble: false
                verbosity_levels:
                    VERBOSITY_NORMAL: WARNING
                    VERBOSITY_VERBOSE: NOTICE
                    VERBOSITY_VERY_VERBOSE: INFO
                    VERBOSITY_DEBUG: DEBUG                
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
                
            mailer:
                type: stream
                path: '%kernel.logs_dir%/mailer.log'
                level: debug
                channels: ['mailer']                

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            mailer:
                type: stream
                path: '%kernel.logs_dir%/mailer.log'
                level: debug
                channels: ['mailer']